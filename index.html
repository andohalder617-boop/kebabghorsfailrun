    <!-- ─── SCRIPT CONTROLS ─── -->
    <script>
        // ─── CINEMATIC ENTRANCE ANIMATION ───
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const bgVideo = document.getElementById('bg-video');
                const bgScrim = document.getElementById('bg-scrim');
                const hiddenContents = document.querySelectorAll('.intro-hidden-content');

                if (bgVideo) bgVideo.style.filter = 'brightness(1) contrast(1)';
                if (bgScrim) bgScrim.style.opacity = '1';

                hiddenContents.forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('intro-revealed');
                    }, index * 120);
                });
            }, 1200); // 1.2s bright video intro preview
        });

        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        function toggleMobileMenu() {
            mobileMenu.classList.toggle('hidden');
            mobileMenu.classList.toggle('flex');
        }

        mobileMenuBtn.addEventListener('click', toggleMobileMenu);

        // ─── EXPANDED DISH MODAL DATA & MECHANIC ───
        const dishData = {
            reshmi: {
                tag: 'POPULAR CHOICE',
                titleBn: 'রেশমি মালাই টিক্কা',
                titleEn: 'Reshmi Malai Tikka',
                price: '₹170',
                portion: '6 Pieces',
                img: 'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=600&q=80',
                desc: 'Tender boneless chicken breasts steeped in a velvet 24-hour marination of cashews, heavy cream, white pepper, and royal Mughlai spices, charred over glowing charcoal coals.',
                ingredients: 'Chicken breast, cashew cream, hung curd, white pepper, royal mace, ghee, lemon juice'
            },
            hariyali: {
                tag: 'CHEF SPECIAL',
                titleBn: 'হারিয়ালি কাবাব',
                titleEn: 'Hariyali Mint Tikka',
                price: '₹150',
                portion: '6 Pieces',
                img: 'assets/hariyali-kebab.jpg..jpg',
                desc: 'Vibrant green chicken skewers infused with fresh garden mint, coriander, spicy green chillies, lemon zest, and toasted cumin, char-grilled in our clay tandoor oven.',
                ingredients: 'Chicken chunks, fresh mint, coriander leaves, green chillies, strained yogurt, roasted cumin'
            },
            roast: {
                tag: 'ROYAL FEAST',
                titleBn: 'সম্পূর্ণ চিকেন রোস্ট',
                titleEn: 'Full Whole Chicken Roast',
                price: '৳ 300 / ₹300',
                portion: 'Whole Chicken',
                img: 'assets/full-chicken-roast.jpg.jpg',
                desc: 'A grand feast featuring a whole chicken marinated in authentic Bengali mustard aromatics, Kashmiri red chili, garlic, and slow oven-roasted until crisp outside and juicy within.',
                ingredients: 'Whole chicken, mustard oil, Kashmiri chili paste, ginger-garlic paste, nutmeg, mace'
            }
        };

        function openDishModal(key) {
            const data = dishData[key];
            if (!data) return;

            document.getElementById('modal-dish-img').src = data.img;
            document.getElementById('modal-dish-tag').textContent = data.tag;
            document.getElementById('modal-dish-title-bn').textContent = data.titleBn;
            document.getElementById('modal-dish-title-en').textContent = data.titleEn;
            document.getElementById('modal-dish-price').textContent = data.price;
            document.getElementById('modal-dish-portion').textContent = data.portion;
            document.getElementById('modal-dish-desc').textContent = data.desc;
            document.getElementById('modal-dish-ingredients').textContent = data.ingredients;

            document.getElementById('dish-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeDishModal() {
            document.getElementById('dish-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function goToMenuFromModal() {
            closeDishModal();
            openFullMenu();
        }

        // ─── POWERPOINT-STYLE SUBTLE 2D SLIDE TRANSITION ───
        const slideOverlay = document.getElementById('slide-transition-overlay');

        function trigger2DSlideTransition(onMidpoint) {
            slideOverlay.classList.add('active');

            setTimeout(() => {
                if (onMidpoint) onMidpoint();
                
                setTimeout(() => {
                    slideOverlay.classList.remove('active');
                }, 300);
            }, 500);
        }

        function openFullMenu() {
            trigger2DSlideTransition(() => {
                const menuPage = document.getElementById('full-menu-page');
                menuPage.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            });
        }

        function closeFullMenu() {
            trigger2DSlideTransition(() => {
                const menuPage = document.getElementById('full-menu-page');
                menuPage.classList.add('hidden');
                document.body.style.overflow = 'auto';
            });
        }
    </script>
